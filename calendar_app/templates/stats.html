{% extends 'master.html' %}
{% load static %}


{% block content %}

<!-- Home button -->
<a href="/">
    <button class="btn btn-light position-absolute top-0 start-0 m-3">
       <i class="fa-solid fa-house"></i>
    </button>
</a>

<div class="container py-5">

    <h1 class="mb-5 text-center">
        📊 Estadísticas
    </h1>

    <!-- ===================== -->
    <!-- QUESTION STATS -->
    <!-- ===================== -->

    <div class="accordion" id="accordionFlushExample">
        <div class="accordion-item bg-dark text-white border-0">
            <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseOne" aria-expanded="false" aria-controls="flush-collapseOne">
                Respuestas
            </button>
            </h2>
            <div id="flush-collapseOne" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                <div class="accordion-body">
                    <div class="container mb-5 text-white">

                        <div class="card-body">

                            <h4 class="mb-4">
                                Distribución de respuestas
                            </h4>

                            <div class="mb-4">

                                <label class="form-label">
                                    Selecciona un día
                                </label>

                                <select
                                    id="questionSelect"
                                    class="form-select">

                                    {% for day in days %}
                                        <option value="{{ day }}">
                                            Día {{ day }}
                                        </option>
                                    {% endfor %}

                                </select>

                            </div>

                            <div class="d-flex justify-content-center">

                                <canvas
                                    id="questionChart"
                                    style="max-width: 500px;">
                                </canvas>

                            </div>

                        </div>

                    </div>

                    <div class="container mb-5 text-white">

                        <div class="card-body">

                            <h4 class="mb-4">
                                ❓ Respuesta de usuario por pregunta
                            </h4>

                            <div class="row g-3">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Usuario
                                    </label>

                                    <select id="uqUser"
                                            class="form-select">

                                        {% for user in users %}
                                            <option value="{{ user.id }}">
                                                {{ user.username }}
                                            </option>
                                        {% endfor %}

                                    </select>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Pregunta
                                    </label>

                                    <select id="uqQuestion"
                                            class="form-select">

                                        {% for day in days %}
                                            <option value="{{ day }}">
                                                Día {{ day }}
                                            </option>
                                        {% endfor %}

                                    </select>

                                </div>

                            </div>

                            <div id="uqResult"
                                class="mt-4">

                            </div>

                        </div>

                    </div>
                </div>
            </div>
        </div>
        <div class="accordion-item bg-dark text-white border-0">
            <h2 class="accordion-header">
            <button class="accordion-button collapsed" type="button" data-bs-toggle="collapse" data-bs-target="#flush-collapseTwo" aria-expanded="false" aria-controls="flush-collapseTwo">
                Matchings
            </button>
            </h2>
            <div id="flush-collapseTwo" class="accordion-collapse collapse" data-bs-parent="#accordionFlushExample">
                <div class="accordion-body">
                    <div class="container mb-5 text-white">

                        <div class="card-body">

                            <h4 class="mb-4">
                                🧑‍🤝‍🧑 Matchings usuario vs usuario
                            </h4>

                            <div class="row g-3 mb-4">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Selecciona un usuario
                                    </label>

                                    <select
                                        id="matchGraph1Select"
                                        class="form-select">

                                        {% for user in users %}
                                            <option value="{{ user.id }}">
                                                {{ user.username }}
                                            </option>
                                        {% endfor %}

                                    </select>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Selecciona un usuario
                                    </label>

                                    <select id="matchGraph2Select"
                                            class="form-select">

                                        {% for user in users %}
                                            <option value="{{ user.id }}">
                                                {{ user.username }}
                                            </option>
                                        {% endfor %}

                                    </select>

                                </div>

                            </div>

                            <div class="position-relative" style="height: clamp(320px, 50vh, 500px);">

                            <canvas
                                id="matchGraphContainer">
                            </canvas>

                        </div>

                        </div>
                    </div>
                    <div class="container mb-5 text-white">

                        <div class="card-body">

                            <h4 class="mb-4">
                                ❤️ Matchings por usuario
                            </h4>

                            <div class="row g-3 mb-4">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Selecciona un usuario
                                    </label>

                                    <select
                                        id="userSelect"
                                        class="form-select">

                                        {% for user in users %}
                                            <option value="{{ user.id }}">
                                                {{ user.username }}
                                            </option>
                                        {% endfor %}

                                    </select>

                                </div>

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Rango
                                    </label>

                                    <select id="rangeSelect"
                                            class="form-select">

                                            <option value="actual">
                                                Actual
                                            </option>

                                            <option value="global">
                                                Global
                                            </option>

                                    </select>

                                </div>

                            </div>

                            <div id="matchesContainer">

                            </div>

                        </div>
                    </div>
                </div>
            </div>
        </div>
        <div class="accordion-item bg-dark text-white border-0">

            <h2 class="accordion-header">

                <button
                    class="accordion-button collapsed"
                    type="button"
                    data-bs-toggle="collapse"
                    data-bs-target="#flush-collapseThree"
                    aria-expanded="false"
                    aria-controls="flush-collapseThree">

                    Análisis psicológico

                </button>

            </h2>

            <div
                id="flush-collapseThree"
                class="accordion-collapse collapse"
                data-bs-parent="#accordionFlushExample">

                <div class="accordion-body">

                    <div class="container mb-5 text-white">

                        <div class="card-body">

                            <h4 class="mb-4">
                                🧠 Perfil ético
                            </h4>

                            <div class="row g-3 mb-4">

                                <div class="col-md-6">

                                    <label class="form-label">
                                        Selecciona un usuario
                                    </label>

                                    <select
                                        id="ethicalUserSelect"
                                        class="form-select">

                                        {% for user in users %}
                                            <option value="{{ user.id }}">
                                                {{ user.username }}
                                            </option>
                                        {% endfor %}

                                    </select>

                                </div>

                            </div>

                            <div class="d-flex justify-content-center">

                                <div
                                    class="position-relative"
                                    style="width: min(100%, 500px); height: min(80vw, 500px);">

                                    <canvas id="ethicalChart"></canvas>

                                </div>

                            </div>

                            <button
                                id="downloadEthicsChart"
                                class="btn btn-light">

                                Descargar

                            </button>

                        </div>

                    </div>

                </div>

            </div>

        </div>
    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<!-- Custom JS -->
<script src="{% static 'calendar_app/js/stats.js' %}"></script>

{% endblock %}
