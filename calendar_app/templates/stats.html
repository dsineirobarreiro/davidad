{% extends 'master.html' %}

{% block content %}

<div class="container py-5">

    <h1 class="mb-5 text-center">
        📊 Estadísticas
    </h1>

    <!-- ===================== -->
    <!-- QUESTION STATS -->
    <!-- ===================== -->

    <div class="card shadow-sm mb-5">

        <div class="card-body">

            <h4 class="mb-4">
                Distribución de respuestas
            </h4>

            <div class="mb-4">

                <label class="form-label">
                    Selecciona un día
                </label>

                <select
                    id="questionSelect"
                    class="form-select">

                    {% for day in days %}
                        <option value="{{ day }}">
                            Día {{ day }}
                        </option>
                    {% endfor %}

                </select>

            </div>

            <div class="d-flex justify-content-center">

                <canvas
                    id="questionChart"
                    style="max-width: 500px;">
                </canvas>

            </div>

        </div>

    </div>

    <!-- ===================== -->
    <!-- MATCHINGS -->
    <!-- ===================== -->

    <div class="card shadow-sm">

        <div class="card-body">

            <h4 class="mb-4">
                ❤️ Matchings
            </h4>

            <div class="mb-4">

                <label class="form-label">
                    Selecciona un usuario
                </label>

                <select
                    id="userSelect"
                    class="form-select">

                    {% for user in users %}
                        <option value="{{ user.id }}">
                            {{ user.username }}
                        </option>
                    {% endfor %}

                </select>

            </div>

            <div id="matchesContainer">

            </div>

        </div>

    </div>

</div>

<!-- Chart.js -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script>

let chart = null;

async function loadQuestionStats(day) {

    const response = await fetch(
        `/api/question-stats/${day}/`
    );

    const result = await response.json();

    const labels = result.data.map(x => x.label);
    const counts = result.data.map(x => x.count);

    const ctx = document
        .getElementById('questionChart');

    if (chart) {
        chart.destroy();
    }

    chart = new Chart(ctx, {

        type: 'pie',

        data: {

            labels: labels,

            datasets: [{
                data: counts
            }]
        }
    });
}

async function loadUserMatches(userId) {

    const response = await fetch(
        `/api/user-matches/${userId}/`
    );

    const result = await response.json();

    const container = document.getElementById(
        "matchesContainer"
    );

    container.innerHTML = "";

    result.matches.forEach(match => {

        container.innerHTML += `

            <div class="mb-3">

                <div class="d-flex justify-content-between mb-1">

                    <strong>
                        ${match.username}
                    </strong>

                    <span>
                        ${match.percentage}%
                    </span>

                </div>

                <div class="progress">

                    <div
                        class="progress-bar"
                        role="progressbar"
                        style="width: ${match.percentage}%">

                    </div>

                </div>

            </div>

        `;
    });
}

document.addEventListener("DOMContentLoaded", () => {

    const questionSelect =
        document.getElementById("questionSelect");

    const userSelect =
        document.getElementById("userSelect");

    loadQuestionStats(questionSelect.value);
    loadUserMatches(userSelect.value);

    questionSelect.addEventListener("change", () => {

        loadQuestionStats(questionSelect.value);

    });

    userSelect.addEventListener("change", () => {

        loadUserMatches(userSelect.value);

    });

});

</script>

{% endblock %}
