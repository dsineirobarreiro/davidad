<!DOCTYPE html>

<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Login</title>

<!-- Bootstrap CSS -->
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

</head>

<body class="bg-dark">

<div class="container vh-100 d-flex justify-content-center align-items-center">
    <div class="card shadow p-4 bg-white" style="width: 100%; max-width: 400px; border-radius: 12px;">

    <div class="text-center mb-4">
        <h3>🎄 Bienvenido</h3>
        <p class="text-muted mb-0">Calendario de Adviento</p>
    </div>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input 
                type="text" 
                name="username" 
                class="form-control" 
                placeholder="Introduce tu usuario"
                required
            >
        </div>

        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input 
                type="password" 
                name="password" 
                class="form-control" 
                placeholder="Introduce tu contraseña"
                required
            >
        </div>

        <button type="submit" class="btn btn-primary w-100">
            Entrar
        </button>
    </form>

</div>

</div>

</body>
</html>
