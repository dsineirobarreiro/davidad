{% extends 'master.html' %}
{% load static %}

{% block content %}

<div class="container min-vh-100 d-flex justify-content-center align-items-center">

<div class="card shadow p-4" style="max-width: 400px; max-width: 75vw; border-radius: 16px;">

    <div class="text-center mb-4">
        <h3>🎄 Crear cuenta</h3>
        <p class="text-muted mb-0">Regístrate para obtener tu calendario de adviento</p>
    </div>

    <form method="post">
        {% csrf_token %}

        {% if form.non_field_errors %}
            <div class="alert alert-danger">
                {{ form.non_field_errors }}
            </div>
        {% endif %}

        <!-- USERNAME -->
        <div class="mb-3">
            <label class="form-label">Usuario</label>
            <input type="text" name="username" class="form-control" placeholder="Introduce tu usuario" required>
        </div>

        <!-- PASSWORD -->
        <div class="mb-3">
            <label class="form-label">Contraseña</label>
            <input type="password" name="password" class="form-control" placeholder="Introduce tu contraseña" required>
        </div>

        <!-- CONFIRM -->
        <div class="mb-3">
            <label class="form-label">Confirmar contraseña</label>
            <input type="password" name="password_confirm" class="form-control" placeholder="Confirma tu contraseña" required>
        </div>

        <button class="btn btn-primary w-100">
            Crear cuenta
        </button>
    </form>

    <div class="text-center mt-3">
        <small>
            ¿Ya tienes cuenta?
            <a href="{% url 'login' %}">Entrar</a>
        </small>
    </div>

</div>

</div>

{% endblock %}
